{% extends "base.html" %}
{% block title %}My Favorites{% endblock %}
{% block content %}
<h1>My Favorites</h1>
{% if favorites %}
  <div class="cards">
    {% for f in favorites %}
      <div class="card">
        <a href="{{ url_for('item', item_id=f.place_xid) }}">
          {% if f.place_image %}<img src="{{ f.place_image }}" alt="{{ f.place_name }}">{% endif %}<span>{{ f.place_name }}</span>
        </a>
        <form method="post" action="{{ url_for('favorites_remove') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="place_xid" value="{{ f.place_xid }}">
          <input type="hidden" name="next" value="{{ url_for('favorites') }}">
          <button class="btn remove">Remove</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>No favorites yet. Find something and save it!</p>
{% endif %}
{% endblock %}
